on:
  push:
    branches:
      - main
      - master
      - RELEASE_**
  pull_request:
    branches:
      - main
      - master
      - RELEASE_**

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libbz2-dev liblzma-dev zlib1g-dev

      - name: Install BiocManager
        run: |
          install.packages("BiocManager")
        shell: Rscript {0}

      - name: Set Bioconductor repositories
        run: |
          BiocManager::install(version = BiocManager::version(), ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Install package dependencies
        run: |
          deps <- c(
            "GenomeInfoDb", "RUnit", "AnnotationHub",
            "BSgenome.Hsapiens.UCSC.hg19",
            "TxDb.Hsapiens.UCSC.hg19.knownGene",
            "SNPlocs.Hsapiens.dbSNP144.GRCh37",
            "SIFT.Hsapiens.dbSNP132", "SIFT.Hsapiens.dbSNP137",
            "PolyPhen.Hsapiens.dbSNP131", "snpStats",
            "ggplot2", "BiocStyle", "knitr", "magick", "jsonlite",
            "httr", "rjsoncons", "covr"
          )
          BiocManager::install(deps, ask = FALSE, update = FALSE)
          BiocManager::install(
            remotes::local_package_deps(dependencies = TRUE),
            ask = FALSE, update = FALSE
          )
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL .

      - name: Run coverage
        run: |
          cov <- covr::package_coverage(type = "all")
          print(cov)
          covr::codecov(coverage = cov, token = Sys.getenv("CODECOV_TOKEN"),
                        quiet = FALSE)
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
